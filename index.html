<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bullion Ledger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #141310;
    --panel: #1C1A15;
    --panel2: #211F19;
    --hairline: #38352C;
    --hairline-soft: #2A281F;
    --gold: #C9A227;
    --gold-bright: #E4C158;
    --silver: #B9BEC6;
    --silver-bright: #D8DCE2;
    --amber: #C98A3B;
    --cream: #EDE7D9;
    --cream-dim: #A9A395;
    --sage: #6E8F5C;
    --rust: #B4553B;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif; }
  h1 { font-family:'Fraunces',serif; font-weight:500; font-size:24px; margin:0; letter-spacing:-0.01em; }
  .label { font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--cream-dim); font-weight:600; }
  .mono { font-family:'JetBrains Mono',monospace; }
  .panel { background:var(--panel); border:1px solid var(--hairline); }
  header { border-bottom:1px solid var(--hairline); padding:22px 24px 18px; }
  .head-row { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .sub { color:var(--cream-dim); font-size:12px; font-family:'JetBrains Mono',monospace; }
  .tabs { display:flex; gap:4px; margin-top:16px; }
  .tab-btn { background:transparent; color:var(--cream-dim); border:1px solid transparent; padding:7px 16px;
    font-size:13px; font-family:'Inter',sans-serif; font-weight:500; cursor:pointer; border-radius:4px 4px 0 0; }
  .tab-btn.active { background:var(--panel2); color:var(--gold-bright); border:1px solid var(--hairline); border-bottom:1px solid var(--panel2); }
  main { padding:24px; max-width:1100px; margin:0 auto; }
  .tab-content { display:none; }
  .tab-content.active { display:block; }
  .ticker { display:flex; flex-wrap:wrap; margin-bottom:20px; }
  .ticker-item { padding:16px 18px; border-right:1px solid var(--hairline); flex:1; min-width:140px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }
  .price { font-family:'Fraunces',serif; font-size:26px; font-weight:500; line-height:1; }
  .price small { font-size:12px; color:var(--cream-dim); font-family:'Inter',sans-serif; margin-left:4px; }
  .change-row { display:flex; align-items:center; gap:6px; margin-top:8px; font-size:12px; }
  .badge { font-size:10px; border:1px solid; padding:1px 5px; border-radius:2px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; margin-bottom:20px; }
  .grid-narrow { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-bottom:20px; }
  .grid-summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .card { padding:16px; }
  canvas { max-height:200px; }
  table { width:100%; border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:12px; }
  th { text-align:left; padding:8px 12px; color:var(--cream-dim); font-family:'Inter',sans-serif; font-weight:600;
    font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; white-space:nowrap; border-bottom:1px solid var(--hairline); }
  td { padding:8px 12px; border-bottom:1px solid var(--hairline-soft); white-space:nowrap; }
  .table-wrap { overflow-x:auto; }
  input, select { width:100%; background:var(--panel2); border:1px solid var(--hairline); color:var(--cream);
    padding:7px 9px; font-size:13px; font-family:'JetBrains Mono',monospace; border-radius:3px; margin-top:4px; box-sizing:border-box; }
  .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; }
  button.primary { margin-top:14px; background:var(--gold); color:#141310; border:none; padding:8px 16px;
    font-size:13px; font-weight:600; font-family:'Inter',sans-serif; cursor:pointer; border-radius:3px; }
  .msg { margin-bottom:16px; padding:9px 14px; font-size:13px; border-radius:4px; }
  .msg.error { background:rgba(180,85,59,0.12); border:1px solid var(--rust); color:var(--rust); }
  .msg.success { background:rgba(110,143,92,0.12); border:1px solid var(--sage); color:var(--sage); }
  .action-pill { text-align:center; padding:7px 0; font-size:12.5px; font-weight:600; border-radius:3px; margin-top:6px; }
  .empty { color:var(--cream-dim); font-size:13px; padding:14px; }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <h1>◆ Bullion Ledger</h1>
    <span class="sub" id="header-sub">loading…</span>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="history">History</button>
    <button class="tab-btn" data-tab="purchases">Purchases</button>
  </div>
</header>

<main>
  <div id="msg-box"></div>

  <div class="tab-content active" id="tab-overview">
    <div class="panel ticker" id="ticker-row"></div>
    <div class="grid" id="chart-grid"></div>
    <div class="label">Valuation &amp; Recommendation</div>
    <div class="grid-narrow" id="valuation-grid" style="margin-top:10px;"></div>
    <div class="label">Best Buying Opportunities So Far</div>
    <div class="panel card" id="opportunities-box" style="margin-top:10px;"></div>
  </div>

  <div class="tab-content" id="tab-history">
    <div class="label">Historical Table (from bullion_history.csv — updated daily by GitHub Actions)</div>
    <div class="panel table-wrap" style="margin-top:10px;">
      <table id="history-table"></table>
    </div>
  </div>

  <div class="tab-content" id="tab-purchases">
    <div class="label">Log a Purchase</div>
    <div class="panel card" style="margin-top:10px; margin-bottom:24px;">
      <div class="form-grid">
        <div><div class="label">Date</div><input type="date" id="p-date"></div>
        <div><div class="label">Asset</div>
          <select id="p-asset">
            <option>Gold</option>
            <option>Silver</option>
          </select>
        </div>
        <div id="p-purity-wrap"><div class="label">Purity</div>
          <select id="p-purity">
            <option value="24K">24K</option>
            <option value="22K">22K</option>
            <option value="18K">18K</option>
          </select>
        </div>
        <div><div class="label">Quantity (g)</div><input type="number" id="p-qty" placeholder="0.00"></div>
        <div><div class="label">Price / g</div><input type="number" id="p-price" placeholder="0.00"></div>
      </div>
      <button class="primary" onclick="addPurchase()">+ Log Purchase</button>
    </div>

    <div class="label">Portfolio Summary</div>
    <div class="grid-summary" id="portfolio-summary" style="margin-top:10px;"></div>

    <div class="label">Purchase Log</div>
    <div class="panel table-wrap" style="margin-top:10px;">
      <table id="purchase-table"></table>
    </div>
  </div>
</main>

<script>
const COLORS = { g24: "#E4C158", g22: "#C9A227", g18: "#C98A3B", silver: "#D8DCE2" };
const METAL_LABELS = { g24: "Gold 24KT", g22: "Gold 22KT", g18: "Gold 18KT", silver: "Silver" };
let HISTORY = [];
let purchases = JSON.parse(localStorage.getItem("bullion-ledger:purchases") || "[]");
let charts = {};

// ---------- tabs ----------
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
  });
});

// ---------- helpers ----------
function fmtDateDisp(iso) { const [y,m,d] = iso.split("-"); return `${d}-${m}-${y}`; }
function fmtINR(n, dec=0) { if (n===null||n===undefined||isNaN(n)) return "—";
  return "₹" + Number(n).toLocaleString("en-IN", {maximumFractionDigits:dec, minimumFractionDigits:dec}); }
function fmtPct(n) { if (n===null||n===undefined||isNaN(n)) return "—"; return (n>0?"+":"") + n.toFixed(2) + "%"; }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function pctChange(curr, prev){ if(!prev) return null; return ((curr-prev)/prev)*100; }
function showMsg(text, type) {
  document.getElementById("msg-box").innerHTML = `<div class="msg ${type}">${text}</div>`;
  setTimeout(()=>{ document.getElementById("msg-box").innerHTML=""; }, 4000);
}

// ---------- CSV parsing ----------
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(",");
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const cells = line.split(",");
    const obj = {};
    headers.forEach((h,i) => obj[h.trim()] = (cells[i] ?? "").trim());
    return {
      date: obj.date,
      g24: parseFloat(obj.gold_24kt),
      g22: parseFloat(obj.gold_22kt),
      g18: parseFloat(obj.gold_18kt),
      silver: parseFloat(obj.silver_per_gram),
    };
  }).filter(r => r.date && !isNaN(r.g24));
}

// ---------- analytics (mirrors the original tracker logic) ----------
function computeSeries(history) {
  const metals = ["g24","g22","g18","silver"];
  const running = {}; metals.forEach(m => running[m] = {ath:-Infinity, atl:Infinity});
  return history.map((entry, idx) => {
    const prev = idx>0 ? history[idx-1] : null;
    const momEntry = (() => {
      let best=null, bestDiff=Infinity;
      for (let i=0;i<idx;i++){ const gap=daysBetween(history[i].date, entry.date);
        if (gap>=24 && gap<=40){ const diff=Math.abs(gap-32); if(diff<bestDiff){bestDiff=diff; best=history[i];} } }
      return best;
    })();
    const wow={}, mom={}, isNewHigh={}, isNewLow={};
    metals.forEach(m => {
      wow[m] = prev ? pctChange(entry[m], prev[m]) : null;
      mom[m] = momEntry ? pctChange(entry[m], momEntry[m]) : null;
      isNewHigh[m] = entry[m] > running[m].ath;
      isNewLow[m] = entry[m] < running[m].atl;
      running[m].ath = Math.max(running[m].ath, entry[m]);
      running[m].atl = Math.min(running[m].atl, entry[m]);
    });
    return {...entry, wow, mom, isNewHigh, isNewLow};
  });
}
function trendLabel(history, metal, n) {
  const slice = history.slice(-Math.min(n, history.length));
  if (slice.length<2) return {label:"Insufficient data", dir:"flat"};
  const pct = pctChange(slice[slice.length-1][metal], slice[0][metal]);
  let dir = "flat"; if (pct>0.5) dir="up"; else if (pct<-0.5) dir="down";
  return {label: dir==="up"?"Uptrend":dir==="down"?"Downtrend":"Sideways", dir, pct};
}
function valuationForMetal(history, metal) {
  if (history.length<2) return {label:"Fair Value", percentile:50, confidence:30};
  const vals = history.map(e=>e[metal]);
  const min=Math.min(...vals), max=Math.max(...vals), curr=vals[vals.length-1];
  const percentile = max===min ? 50 : ((curr-min)/(max-min))*100;
  let label;
  if (percentile<=10) label="Very Cheap"; else if (percentile<=30) label="Cheap";
  else if (percentile<=70) label="Fair Value"; else if (percentile<=90) label="Expensive"; else label="Very Expensive";
  const confidence = Math.min(95, Math.round(30 + history.length*4));
  return {label, percentile, confidence};
}
function recommendation(valLabel, trend) {
  const map = {"Very Cheap":"Strong Buy","Cheap":"Buy","Fair Value":"Hold","Expensive":"Wait for Dip","Very Expensive":"Avoid Buying Now"};
  let action = map[valLabel] || "Hold";
  if (valLabel==="Fair Value" && trend.dir==="down") action="Wait for Dip";
  if (valLabel==="Fair Value" && trend.dir==="up") action="Buy";
  return action;
}
function actionColor(action) {
  if (action==="Strong Buy") return "#6E8F5C";
  if (action==="Buy") return "#C9A227";
  if (action==="Hold") return "#B9BEC6";
  if (action==="Wait for Dip") return "#C98A3B";
  return "#B4553B";
}

// ---------- render ----------
function renderTicker(series) {
  const latest = series[series.length-1];
  const metals = ["g24","g22","g18","silver"];
  document.getElementById("ticker-row").innerHTML = metals.map(m => {
    const wow = latest.wow[m];
    return `<div class="ticker-item">
      <div><span class="dot" style="background:${COLORS[m]}"></span><span class="label">${METAL_LABELS[m]}</span></div>
      <div class="price">${fmtINR(latest[m])}<small>/g</small></div>
      <div class="change-row">
        ${wow!==null ? `<span class="mono" style="color:${wow>0?'#6E8F5C':wow<0?'#B4553B':'#A9A395'}">${fmtPct(wow)} WoW</span>` : `<span class="mono" style="color:#A9A395">baseline</span>`}
        ${latest.isNewHigh[m] ? `<span class="badge" style="color:#C9A227;border-color:#C9A227">ATH</span>` : ""}
        ${latest.isNewLow[m] ? `<span class="badge" style="color:#D8DCE2;border-color:#B9BEC6">ATL</span>` : ""}
      </div>
    </div>`;
  }).join("");
}

function renderCharts(series) {
  const grid = document.getElementById("chart-grid");
  grid.innerHTML = ["g24","g22","g18","silver"].map(m => `
    <div class="panel card">
      <div class="label">${METAL_LABELS[m]} Trend</div>
      <canvas id="chart-${m}" style="margin-top:10px;"></canvas>
    </div>`).join("");
  const labels = series.map(e => fmtDateDisp(e.date));
  ["g24","g22","g18","silver"].forEach(m => {
    const ctx = document.getElementById(`chart-${m}`);
    if (charts[m]) charts[m].destroy();
    charts[m] = new Chart(ctx, {
      type: "line",
      data: { labels, datasets: [{ data: series.map(e=>e[m]), borderColor: COLORS[m], backgroundColor: COLORS[m],
        pointRadius: 2.5, borderWidth: 2, tension: 0.25 }] },
      options: { responsive:true, plugins:{legend:{display:false}}, scales:{
        x:{ticks:{color:"#A9A395",font:{size:10,family:"JetBrains Mono"}},grid:{color:"#2A281F"}},
        y:{ticks:{color:"#A9A395",font:{size:10,family:"JetBrains Mono"}},grid:{color:"#2A281F"}}
      }}
    });
  });
}

function renderValuation(series) {
  const grid = document.getElementById("valuation-grid");
  grid.innerHTML = ["g24","g22","g18","silver"].map(m => {
    const val = valuationForMetal(HISTORY, m);
    const tr = trendLabel(HISTORY, m, 4);
    const trMed = trendLabel(HISTORY, m, 12);
    const trLong = trendLabel(HISTORY, m, Math.max(HISTORY.length,26));
    const action = recommendation(val.label, tr);
    const slice = HISTORY.slice(-8).map(e=>e[m]);
    const support = slice.length ? Math.min(...slice) : null;
    const resistance = slice.length ? Math.max(...slice) : null;
    const ac = actionColor(action);
    return `<div class="panel card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span style="font-family:'Fraunces',serif;font-size:15px;color:${COLORS[m]}">${METAL_LABELS[m]}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
        <span style="color:#A9A395">Valuation</span><span class="mono">${val.label} (${val.percentile.toFixed(0)}th pct)</span></div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
        <span style="color:#A9A395">Confidence</span><span class="mono">${val.confidence}/100</span></div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
        <span style="color:#A9A395">Short/Med/Long</span><span class="mono">${tr.label.slice(0,2)}/${trMed.label.slice(0,2)}/${trLong.label.slice(0,2)}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:10px;">
        <span style="color:#A9A395">Support/Resistance</span><span class="mono">${fmtINR(support)} / ${fmtINR(resistance)}</span></div>
      <div class="action-pill" style="color:${ac};border:1px solid ${ac}">${action}</div>
    </div>`;
  }).join("");
}

function renderOpportunities(series) {
  const opps = series.filter(e => e.isNewLow.g24||e.isNewLow.g22||e.isNewLow.g18||e.isNewLow.silver).slice(-5).reverse();
  const box = document.getElementById("opportunities-box");
  if (!opps.length) { box.innerHTML = `<div class="empty">No new lows recorded yet.</div>`; return; }
  box.innerHTML = opps.map(e => {
    const metals = ["g24","g22","g18","silver"].filter(m=>e.isNewLow[m]).map(m=>METAL_LABELS[m]).join(", ");
    return `<div class="mono" style="font-size:12.5px;margin-bottom:6px;">› <span style="color:#A9A395">${fmtDateDisp(e.date)}</span> — ${metals} hit a new low</div>`;
  }).join("");
}

function renderHistoryTable(series) {
  const rows = series.slice().reverse().map(e => `
    <tr>
      <td>${fmtDateDisp(e.date)}</td>
      <td style="color:${e.isNewHigh.g24?'#C9A227':e.isNewLow.g24?'#B4553B':'#EDE7D9'}">${fmtINR(e.g24)}</td>
      <td style="color:${e.wow.g24>0?'#6E8F5C':e.wow.g24<0?'#B4553B':'#A9A395'}">${fmtPct(e.wow.g24)}</td>
      <td>${fmtINR(e.g22)}</td>
      <td>${fmtINR(e.g18)}</td>
      <td style="color:${e.isNewHigh.silver?'#C9A227':e.isNewLow.silver?'#B4553B':'#EDE7D9'}">${fmtINR(e.silver)}</td>
      <td style="color:#A9A395">${e.mom.g24!==null ? fmtPct(e.mom.g24) : "—"}</td>
    </tr>`).join("");
  document.getElementById("history-table").innerHTML = `
    <thead><tr><th>Date</th><th>24KT</th><th>WoW</th><th>22KT</th><th>18KT</th><th>Silver</th><th>MoM (24K)</th></tr></thead>
    <tbody>${rows}</tbody>`;
}

// ---------- purchases (localStorage) ----------
document.getElementById("p-asset").addEventListener("change", e => {
  document.getElementById("p-purity-wrap").style.display = e.target.value === "Silver" ? "none" : "block";
});

function addPurchase() {
  const date = document.getElementById("p-date").value;
  const asset = document.getElementById("p-asset").value;
  const purity = asset === "Silver" ? "Fine" : document.getElementById("p-purity").value;
  const qty = parseFloat(document.getElementById("p-qty").value);
  const price = parseFloat(document.getElementById("p-price").value);
  if (!date || !qty || !price) { showMsg("Fill in date, quantity and price.", "error"); return; }
  purchases.push({ id: "p-"+Date.now(), date, asset, purity, qty, price, total: qty*price });
  purchases.sort((a,b)=>a.date.localeCompare(b.date));
  localStorage.setItem("bullion-ledger:purchases", JSON.stringify(purchases));
  document.getElementById("p-qty").value=""; document.getElementById("p-price").value="";
  showMsg(`Logged purchase on ${fmtDateDisp(date)}.`, "success");
  renderPurchases();
}

function renderPurchases() {
  const latest = HISTORY.length ? computeSeries(HISTORY)[HISTORY.length-1] : null;
  const purityToKey = {"24K":"g24","22K":"g22","18K":"g18","Fine":"silver"};
  const withPL = purchases.map(p => {
    const key = purityToKey[p.purity] || "g24";
    const currentPrice = latest ? latest[key] : null;
    const currentValue = currentPrice ? currentPrice*p.qty : null;
    const pl = currentValue!==null ? currentValue-p.total : null;
    const retPct = currentValue!==null ? (pl/p.total)*100 : null;
    return {...p, currentPrice, currentValue, pl, retPct};
  });
  const totalInvested = withPL.reduce((s,p)=>s+p.total,0);
  const currentValue = withPL.reduce((s,p)=>s+(p.currentValue||0),0);
  const gain = currentValue-totalInvested;
  const gainPct = totalInvested ? (gain/totalInvested)*100 : null;

  document.getElementById("portfolio-summary").innerHTML = `
    <div class="panel card"><div class="label">Total Invested</div><div style="font-family:'Fraunces',serif;font-size:20px;margin-top:6px;">${fmtINR(totalInvested)}</div></div>
    <div class="panel card"><div class="label">Current Value</div><div style="font-family:'Fraunces',serif;font-size:20px;margin-top:6px;">${fmtINR(currentValue)}</div></div>
    <div class="panel card"><div class="label">Unrealized P/L</div><div style="font-family:'Fraunces',serif;font-size:20px;margin-top:6px;color:${gain>=0?'#6E8F5C':'#B4553B'}">${fmtINR(gain)}</div></div>
    <div class="panel card"><div class="label">Return %</div><div style="font-family:'Fraunces',serif;font-size:20px;margin-top:6px;color:${gain>=0?'#6E8F5C':'#B4553B'}">${gainPct!==null?fmtPct(gainPct):"—"}</div></div>`;

  if (!withPL.length) {
    document.getElementById("purchase-table").innerHTML = "";
    document.querySelector("#purchase-table").closest(".panel").innerHTML = `<div class="empty">No purchases logged yet.</div>`;
    return;
  }
  const rows = withPL.slice().reverse().map(p => `
    <tr>
      <td>${fmtDateDisp(p.date)}</td><td>${p.asset}</td><td>${p.purity}</td><td>${p.qty}</td>
      <td>${fmtINR(p.price,2)}</td><td>${fmtINR(p.total)}</td>
      <td>${p.currentPrice?fmtINR(p.currentPrice,2):"—"}</td>
      <td style="color:${p.pl>=0?'#6E8F5C':'#B4553B'}">${p.pl!==null?fmtINR(p.pl):"—"}</td>
      <td style="color:${p.retPct>=0?'#6E8F5C':'#B4553B'}">${p.retPct!==null?fmtPct(p.retPct):"—"}</td>
    </tr>`).join("");
  document.getElementById("purchase-table").innerHTML = `
    <thead><tr><th>Date</th><th>Asset</th><th>Purity</th><th>Qty(g)</th><th>Buy ₹/g</th><th>Total</th><th>Current ₹/g</th><th>P/L</th><th>Return %</th></tr></thead>
    <tbody>${rows}</tbody>`;
}

// ---------- init: fetch CSV same-origin ----------
async function init() {
  try {
    const res = await fetch("./bullion_history.csv", { cache: "no-store" });
    if (!res.ok) throw new Error("CSV not found yet");
    const text = await res.text();
    HISTORY = parseCSV(text).sort((a,b)=>a.date.localeCompare(b.date));
    if (!HISTORY.length) throw new Error("CSV is empty");
    const series = computeSeries(HISTORY);
    document.getElementById("header-sub").textContent =
      `${HISTORY.length} daily ${HISTORY.length===1?"entry":"entries"} · since ${fmtDateDisp(HISTORY[0].date)} · last updated ${fmtDateDisp(HISTORY[HISTORY.length-1].date)}`;
    renderTicker(series);
    renderCharts(series);
    renderValuation(series);
    renderOpportunities(series);
    renderHistoryTable(series);
    renderPurchases();
  } catch (err) {
    document.getElementById("header-sub").textContent = "waiting for first scrape…";
    document.getElementById("ticker-row").innerHTML = `<div class="empty" style="padding:16px;">
      No data yet. Run the "Daily Bullion Rate Scrape" workflow once (Actions tab → Run workflow),
      then reload this page. (${err.message})</div>`;
  }
}
init();
</script>
