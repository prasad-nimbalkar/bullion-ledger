name: Daily Bullion Rate Scrape

on:
  schedule:
    # 06:00 UTC = 11:30 AM IST, daily. GitHub may delay a few minutes under load — normal.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

permissions:
  contents: write         # lets the workflow commit bullion_history.csv back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape_rates.py

      - name: Commit updated CSV
        run: |
          git config user.name "bullion-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bullion_history.csv
          git diff --staged --quiet || git commit -m "Update bullion rates $(date -u +'%Y-%m-%d')"
          git push
      # Note: no separate deploy step needed — GitHub Pages serves the repo's
      # main branch directly, so index.html picks up the new CSV on next page load.