name: Daily Gold & Silver Rate Scrape

on:
  schedule:
    # Runs at 06:00 UTC = 11:30 AM IST, daily.
    # GitHub may delay scheduled runs by a few minutes during high load — that's normal.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write         # needed so the workflow can commit the updated CSV back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape_gold_rate.py

      - name: Commit updated CSV
        run: |
          git config user.name "gold-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gold_silver_history.csv
          git diff --staged --quiet || git commit -m "Update gold/silver rates $(date -u +'%Y-%m-%d')"
          git push
