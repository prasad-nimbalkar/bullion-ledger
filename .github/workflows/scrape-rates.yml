name: Daily Bullion Rate Scrape

concurrency:
  group: bullion-ledger-writes
  cancel-in-progress: false

on:
  schedule:
    # 06:00 UTC = 11:30 AM IST, daily. GitHub may delay a few minutes under load — normal.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

permissions:
  contents: write         # lets the workflow commit bullion_history.csv back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape_rates.py

      - name: Commit updated CSV
        run: |
          git config user.name "bullion-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bullion_history.csv
          if git diff --staged --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Update bullion rates $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Push failed after 3 attempts"; exit 1
      # Note: no separate deploy step needed — GitHub Pages serves the repo's
      # main branch directly, so index.html picks up the new CSV on next page load.